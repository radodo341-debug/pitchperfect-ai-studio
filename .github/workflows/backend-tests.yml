name: Backend smoke tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - main
      - feature/reproducible-ai-backend-player-selection
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install smoke-test dependencies
        run: python -m pip install fastapi==0.115.12 python-multipart==0.0.20 opencv-python-headless==4.10.0.84 pytest==8.3.5 httpx==0.28.1
      - name: Run backend smoke tests
        run: python -m pytest -q tests
