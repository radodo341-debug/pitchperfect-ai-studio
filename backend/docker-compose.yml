services:
  pitchperfect-ai:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      TDEED_CHECKPOINT_PATH: /models/SoccerNetBall_challenge1/checkpoint_best.pt
      PP_TRACKER_MODEL: /models/yolo-person.pt
    volumes:
      - ./models:/models:ro
    restart: unless-stopped
